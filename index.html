<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      한글 픽셀 글꼴(갈무리). 8비트 오락기 느낌은 색보다 글꼴이 먼저 만든다.
      한글 픽셀 글꼴은 만들기가 어려워 직접 넣지 않고 인터넷에서 받아온다.

      주소 끝에 @2.40.3처럼 판(version)을 못 박아 두었다.
      안 적으면 저쪽에서 글꼴을 손볼 때마다 우리 화면 글자 모양이 말없이 바뀐다.

      인터넷이 안 되면 이 줄만 조용히 실패하고 원래 글꼴로 나온다. 게임은 그대로 돌아간다.
    -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.min.css"
    />

    <title>숫자 야구</title>
