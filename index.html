<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      친구에게 문제 링크를 보내면 카톡이 이 글을 읽어서 미리보기 상자에 띄운다.
      없으면 제목만 덩그러니 뜨거나 카톡이 화면에서 아무 글이나 골라다 붙인다.
    -->
    <meta
      name="description"
      content="숫자 야구 게임. 친구에게 문제를 내고 링크로 보낼 수 있습니다."
    />

    <!--
      한글 픽셀 글꼴(갈무리). 만들기가 어려워 직접 넣지 않고 인터넷에서 받아온다.

      주소 끝에 @2.40.3처럼 판(version)을 못 박아 두었다.
      안 적으면 저쪽에서 글꼴을 손볼 때마다 우리 화면 글자 모양이 말없이 바뀐다.

      media="print"와 onload를 빼지 마라. 브라우저는 <head>의 stylesheet를 다 받을 때까지
      화면을 한 점도 그리지 않아서, 인터넷이 느리거나 저 주소가 막힌 곳(회사·학교 망)에서는
      이 줄 하나 때문에 게임이 하얀 화면인 채로 몇십 초를 기다린다.

      인쇄용(print)인 척 걸어 두면 브라우저가 기다리지 않고 그냥 그린다. 다 받아지면
      onload가 media를 all로 바꿔 그때 글꼴이 입혀지고, 못 받아도 게임은 그대로 돌아간다.

      noscript는 자바스크립트를 꺼둔 브라우저용이다. onload가 안 도니까 평범하게 걸어 준다.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.min.css"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.min.css"
      />
    </noscript>

    <title>숫자 야구</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
